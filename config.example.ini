; Lilith configuration.
;
; Copy to config.ini (this happens automatically on first run) and edit either
; by hand or with:  python lilith.py edit
;
; All relative paths are resolved against the project folder, so Lilith can be
; started from any directory on both Linux and Windows.

[server]
; Which AI backend to use:
;   ollama      - talk to a local Ollama server        (easiest, cross-platform)
;   LM studio   - talk to LM Studio's OpenAI-style API (easy, cross-platform)
;   openai      - OpenAI-compatible remote API (messages leave this computer)
;   llama       - load a GGUF file directly            (fully offline)
;   hf          - load a transformers model directly   (needs torch)
server_ai = ollama

; For 'LM studio' / OpenAI-compatible servers. The /v1 suffix is required;
; it is appended automatically if you leave it off.
base_url = http://127.0.0.1:1234/v1
api_key = for_local_not_needed

; Only for 'ollama', and only if it is not on the default port. Useful when
; Ollama runs inside WSL2 and Lilith runs on Windows.
ollama_host =

; Seconds to wait for a reply before giving up.
request_timeout = 120

[ai_config]
persona = lilith_persona.txt
memory = memory.json

; Model name for ollama / LM studio / hf.
ai_model = gemma3

temperature = 0.85
max_tokens = 120

; Where GGUF and transformers models live.
model_path = models

; GGUF filename inside model_path, for server_ai = llama.
;
; Lilith never downloads this -- you place the file there yourself, see the
; README. If model_path holds exactly one .gguf it is loaded whatever it is
; called, so this setting only matters when you keep several models side by
; side. A browser that saved the file as "...(1).gguf" will still work.
local_model = Lilith_AI_8B_Q4_0.gguf

; Only used by server_ai = hf (transformers), which does download from the
; Hugging Face hub. The llama backend ignores this entirely.
; The backend accepts built-in architectures and safetensors weights only;
; repository Python and pickle-based weight files are blocked.
hf_repo_id = CMM7590/Lilith_AI_8B

; Optional immutable revision for the transformers download. Leave blank to
; use the repository's current data files, or set a full 40-character commit
; SHA. Branch names, tags, and abbreviated SHAs are rejected. Python files are
; excluded from new snapshots, and repository code is never executed.
hf_revision =

; How many past turns to send to the model.
max_history_messages = 40

; Hard cap on reply length, in sentences. 0 = no cap, which is the default:
; brevity is an instruction in lilith_persona.txt instead, because cutting the
; text mechanically used to chop her off mid-thought.
max_reply_sentences = 0

; Tell Lilith the local time and how long since the last session, so she can
; notice elapsed time without implying that she waited, suffered, or needed
; attention while the program was closed.
time_awareness = true

; Log generic-assistant phrasing for prompt diagnostics without regenerating or
; replacing the reply. Disable only while debugging prompts.
persona_guard = true

; llama.cpp tuning. n_threads = 0 means "use every CPU core".
;
; n_gpu_layers offloads that many layers to the GPU; 0 is CPU-only and 999
; means "all of them" (llama.cpp clamps it to the model's real layer count).
; The first-run wizard sets this from your GPU/CPU answer. It needs a
; GPU-enabled llama.cpp build -- CUDA for NVIDIA, Vulkan or ROCm for AMD,
; Vulkan or SYCL for Intel. A CPU-only build ignores it entirely.
; If Lilith fails to start with an out-of-memory error, lower it.
n_ctx = 8192
n_threads = 0
n_batch = 256
n_gpu_layers = 0

[lilith_display]
; false = text only, no portrait window. Also the right setting for a headless
; server or an SSH session.
enable = true

display_path = modules/viewer.py
assets_path = assets

; Which art set to use. Each is a folder under assets/ and they contain
; different expressions; Lilith falls back to the closest available image.
;   room  - full scene, extended expressions
;   glass - portrait only
place = room

; Resting expression, returned to after revert_delay seconds.
default_state = idle
revert_delay = 5

blink_min_interval = 4
blink_max_interval = 8
blink_duration = 0.1

; Window size, scaled automatically for HiDPI displays (Windows 11 typically
; runs at 125-150%).
window_geometry = 400x600

; Position as +X+Y, e.g. +1200+200. Leave blank to place her on the right-hand
; side of whatever screen you actually have; a blank value can never put the
; window off-screen.
window_offset =

always_on_top = true

; Windows only, and approximate: Tk cannot do per-pixel transparency, so this
; colour-keys pure black. Best with the 'glass' scene.
transparent = false

[viewer_socket]
; How lilith.py talks to the portrait process. Change the port only if
; something else on your machine already uses 8888.
host = 127.0.0.1
port = 8888
connect_timeout = 10

[translator]
; Translate Lilith's replies. Needs requirements-translate.txt (large download).
enable = false
source_lang = en
target_lang = ru
model_name = facebook/nllb-200-distilled-600M

[logging]
level = INFO
file = app.log
; Rotate at 1 MB, keep 3 old files, so app.log cannot grow without limit.
max_bytes = 1048576
backup_count = 3

[web]
; web_lilith.py is intentionally loopback-only. It has no user accounts or
; remote-access authentication; non-loopback hosts are rejected.
host = 127.0.0.1
port = 5000

; Which loopback origins may call /chat from a browser. Leave blank for
; same-origin only. Public origins and "*" are ignored even if configured;
; cross-origin access does not make the bundled API safe for remote exposure.
; Example for a separately served local front end: http://127.0.0.1:8000
cors_origins =

; The web page has a "show debug info" panel that dumps the entire persona and
; your local file paths into the browser. Leave this off unless you are
; debugging a loopback-only session.
debug_panel = false

[safety]
; Written by the interactive setup after the adult fictional-roleplay,
; plaintext-storage, and mental-health disclosure is accepted. Do not edit this
; to bypass consent; re-run `python lilith.py setup` instead.
consent_version = 0

[setup]
; Set to true once the first-run wizard has recorded current safety consent and
; asked its three setup questions (your name, which scene, GPU or CPU). Set it
; back to false -- or run
; 'python lilith.py setup' -- to be asked again.
complete = false
