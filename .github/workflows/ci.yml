name: CI

# The repo shipped a .gitlab-ci.yml while living on GitHub, so no pipeline has
# ever actually run. This is the missing half: it runs the test suite on both
# Linux and Windows, which is the only way a "supports Linux and Windows 11"
# claim stays true after the next commit.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/windows-py312.txt

      # Tk is a system package on Linux; pip cannot provide it.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install validated Windows 3.12 resolution
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: >-
          python -m pip install -r requirements.txt
          -c constraints/windows-py312.txt

      - name: Install dependencies (unconstrained matrix coverage)
        if: runner.os != 'Windows' || matrix.python != '3.12'
        run: python -m pip install -r requirements.txt

      - name: Verify installed dependency graph
        run: python -m pip check

      # Catches syntax and import errors on every platform.
      - name: Byte-compile everything
        run: python -m compileall -q lilith.py doctor.py web_lilith.py build_static_site.py sanitize_memory.py scan_secrets.py watch_compile.py modules tests

      - name: Validate launcher syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n lilith.sh

      - name: Validate launcher syntax (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath .\lilith.ps1))

      - name: Import every module
        run: |
          python -c "import modules.compat, modules._tui, modules.persona_guard, modules.lilith_memory, modules.lilith_ai, modules.lilith_display, modules._viewer_iface, modules.viewer, modules.config_edit, modules.conv_mgmt, modules.first_run, modules._iface, modules._openai_iface, modules._ollama_iface; print('all modules import')"

      # The smoke test that would have caught the EXISTENCE_KEYWORDS bug.
      - name: Instantiate LilithAI with no backend
        run: python -c "from modules import compat; import modules.lilith_ai as a; L=a.LilithAI(None, compat.load_config(), NO_AI=True); assert L.lilith_reply('hi')=='...'; print('smoke test ok')"

      - name: Run test suite
        run: python tests/test_compat.py

      - name: Run focused safety and backend tests
        run: python -m unittest tests.test_safety tests.test_backends

      # The runner has no model/backend, so exit 1 is an expected diagnostic.
      # A traceback or any other exit code still fails CI.
      - name: Setup checker does not crash
        run: >-
          python -c "import subprocess,sys;
          p=subprocess.run([sys.executable,'doctor.py'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True);
          print(p.stdout);
          assert p.returncode in (0,1) and 'Traceback (most recent call last)' not in p.stdout"

      - name: Audit exact Windows 3.12 environment
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip_audit --local --strict --progress-spinner off

  build-static:
    name: Static site builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install Flask
      # Build a deterministic preview; publication is intentionally disabled.
      - run: python build_static_site.py
      - name: Verify repository-subpath assets
        run: >-
          python -c "from pathlib import Path;
          html=Path('public/index.html').read_text(encoding='utf-8');
          files={p.name for p in Path('public/static').iterdir()};
          assert '/static/' not in html, 'root-absolute static URL found';
          assert 'static/idle.png' in html;
          assert 'backup.txt' not in files and 'current.png' not in files"
      # Deliberately do not upload public/: bundled artwork is not cleared for
      # redistribution. This job proves the build works without publishing it.

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Audit declared dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip_audit -r requirements.txt --strict --progress-spinner off

  secret-scan:
    name: High-confidence secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scan_secrets.py
